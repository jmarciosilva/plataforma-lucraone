services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lucraone-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/vendor
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - lucraone-network
    command: php artisan serve --host=0.0.0.0

  mysql:
    image: mysql:8.4
    container_name: lucraone-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lucraone
      MYSQL_ROOT_PASSWORD: root_pwd_2026
      MYSQL_USER: lucraone
      MYSQL_PASSWORD: lucraone_dev_pwd_2026
      MYSQL_ALLOW_EMPTY_PASSWORD: 0
    ports:
      - "3306:3306"
    volumes:
      - lucraone-mysql:/var/lib/mysql
    networks:
      - lucraone-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lucraone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lucraone-redis:/data
    networks:
      - lucraone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  queue-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: lucraone-queue-worker
    working_dir: /app
    volumes:
      - .:/app
      - /app/vendor
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - lucraone-network
    command: php artisan queue:work redis --sleep=3 --tries=3

  mailpit:
    image: axllent/mailpit:latest
    container_name: lucraone-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - lucraone-network

volumes:
  lucraone-mysql:
    driver: local
  lucraone-redis:
    driver: local

networks:
  lucraone-network:
    driver: bridge
