# Front do painel e da API. Conversa com o php-fpm do serviço `app` pela rede
# interna do compose; o Vite não passa por aqui (o Blade aponta o navegador
# direto para o dev server na 5173 através de public/hot).

# DNS embutido do Docker. valid=10s para acompanhar a recriação de containers
# sem consultar a cada requisição.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    # Docker coleta o que sai em stdout/stderr.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        # O nginx resolve um upstream literal uma única vez, na carga da
        # configuração. Recriar o container `app` lhe dá um IP novo e o nginx
        # continuaria batendo no antigo — 502 até reiniciá-lo à mão.
        # Passando por variável, a resolução vira em tempo de requisição, contra
        # o DNS interno do Docker.
        set $upstream_fpm app:9000;
        fastcgi_pass $upstream_fpm;

        include fastcgi_params;

        # $realpath_root resolve o caminho real: o bind mount do Windows chega
        # ao container por link, e o fpm precisa do caminho que ele enxerga.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Nenhum outro .php é executável: só o front controller do Laravel entra.
    # Sem isto, qualquer arquivo gravado em public/ vira ponto de execução.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles em public/ (menos o desafio do certbot)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
