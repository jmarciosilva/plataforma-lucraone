; =============================================================================
; Sobreposição de PHP para a VPS — ambiente de homologação exposto por HTTPS.
;
; Carregada DEPOIS de zz-dev.ini: o PHP varre conf.d em ordem alfabética, e o
; prefixo zzz- é o que garante que estas diretivas vençam as do php-dev.ini.
;
; Só entra aqui o que muda por causa da exposição pública. memory_limit,
; upload_max_filesize e post_max_size continuam vindo de php.ini.
; =============================================================================

; php-dev.ini liga display_errors para o desenvolvimento no Windows. Num host
; alcançável pela Internet isso imprime caminho de arquivo e linha na resposta
; quando o PHP tem erro fatal — antes de o Laravel conseguir tratar. APP_DEBUG=false
; cobre o lado do framework, não este.
display_errors = Off
display_startup_errors = Off

; O erro não desaparece: vai para o stderr do container (php.ini define
; error_log = /dev/stderr), ou seja para `docker compose logs app`.
log_errors = On
