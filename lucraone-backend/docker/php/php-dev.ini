; Desenvolvimento: erro na tela, e opcache LIGADO.
;
; Desligar o opcache parece o certo em desenvolvimento — só que o código chega
; ao container por bind mount do Windows, onde cada leitura de arquivo custa
; caro. Sem bytecode em cache, o PHP recompila o framework inteiro a cada
; requisição: ~1s só de bootstrap, antes de qualquer código nosso rodar.
;
; A alteração continua aparecendo na hora porque validate_timestamps fica
; ligado: o opcache confere o mtime e recompila só o que mudou.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Confere se o arquivo mudou...
opcache.validate_timestamps = 1
; ...mas no máximo a cada 2s por arquivo. Com freq=0 seria um stat() por
; arquivo por requisição — justamente a operação lenta neste sistema de
; arquivos. Na prática: salvar e recarregar já mostra a alteração.
opcache.revalidate_freq = 2

; Cache de caminhos resolvidos. O padrão (16k) não segura o número de arquivos
; do Laravel, então o PHP refaz resolução de path o tempo todo — de novo, I/O
; caro aqui.
realpath_cache_size = 4096k
realpath_cache_ttl = 300

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
