; Ajustes comuns a desenvolvimento e produção.
; Fica em conf.d/ com prefixo zz- para vencer o php.ini-* da imagem base.

memory_limit = 512M

; Importação de planilhas e anexos de relatório passam por aqui.
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; Relatórios com período longo agregam bastante linha antes de responder.
max_execution_time = 120

; A aplicação grava em UTC (config/app.php) e converte na exibição; manter o
; PHP em UTC evita que uma data nasça em fuso diferente de onde é lida.
date.timezone = UTC

expose_php = Off

; O log vai para stderr, que o Docker coleta — arquivo dentro do container
; ninguém lê e ninguém rotaciona.
error_log = /dev/stderr
log_errors = On
