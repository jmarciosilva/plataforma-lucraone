; Produção: bytecode em memória e nenhum detalhe de erro exposto ao visitante.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; O código não muda dentro de uma imagem imutável: checar mtime a cada include
; é I/O puro. Em contrapartida, todo deploy exige container novo — que é
; exatamente como esta imagem é entregue.
opcache.validate_timestamps = 0

display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
